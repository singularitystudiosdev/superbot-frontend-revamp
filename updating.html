<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>superbot.gg is updating</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3Cmask id='m'%3E%3Cg fill='%23fff'%3E%3Crect x='14' y='32' width='72' height='54' rx='15'/%3E%3Cpath d='M14 46V28Q14 20 21 21Q28 24 36 32Z'/%3E%3Cpath d='M86 46V28Q86 20 79 21Q72 24 64 32Z'/%3E%3C/g%3E%3Cg fill='%23000'%3E%3Cellipse cx='35' cy='58' rx='8' ry='11'/%3E%3Cellipse cx='65' cy='58' rx='8' ry='11'/%3E%3C/g%3E%3C/mask%3E%3C/defs%3E%3Crect width='100' height='100' fill='%23ffffff' mask='url(%23m)'/%3E%3C/svg%3E">
<!--
  superbot.gg "we're updating" page. Cloudflare serves it as the zone's custom
  error page for 5xx while the tunnel reports the edge down (deploys). It is
  fully self-contained: no request leaves this file, because the origin is down.
  Look plan: bg #000000, fg #ececec, muted #9a9a9a, hairline #262626,
  surface #181818; one accent, the brand CTA gradient #2b6bff to #6a1fd8
  (progress fill and status dot only); logo artwork #ffffff with #00e5c3 and
  #c026d3 chromatic edges. One family (system sans). Radii 9999px and 8px.
  Motion is unconditional (.cosmos/rules/motion-always-on.mdc).
-->
<style>
:root {
  --bg: #000000;
  --fg: #ececec;
  --muted: #9a9a9a;
  --hairline: #262626;
  --surface: #181818;
  --accent: linear-gradient(90deg, #2b6bff, #6a1fd8); /* brand CTA gradient, live on superbot.gg */
  --art: #ffffff;
  --edge-a: #00e5c3;
  --edge-b: #c026d3;
  --pill: 9999px;
  --r: 8px;
  --font: -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body {
  font: 400 16px/1.5 var(--font);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.stars { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.5; }
/* the side margins clear a phone's notch on its side (viewport-fit=cover) */
.wrap { width: min(100% - max(16px, env(safe-area-inset-left, 0px)) - max(16px, env(safe-area-inset-right, 0px)), 1120px); margin: 0 auto; position: relative; }

header.wrap { margin-top: 12px; } /* the header is the pill alone: 49px, not 61 */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 12px 8px 16px;
  border: 1px solid var(--hairline);
  border-radius: var(--pill);
  background: color-mix(in srgb, var(--surface) 40%, var(--bg));
}
.brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
.brand svg { width: 24px; height: 24px; display: block; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
  border: 1px solid var(--hairline);
  border-radius: var(--pill);
  color: var(--muted);
  font-size: 14px;
}
.dot { width: 8px; height: 8px; border-radius: var(--pill); background: var(--accent); animation: pulse 1.6s ease-in-out infinite; } /* deliberate */
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.75); } }

main { flex: 1; display: flex; align-items: center; padding: 48px 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: 48px;
  padding: 0 48px;
}
h1 {
  margin: 0;
  font-size: clamp(40px, 6vw, 64px);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.03em;
}
.sub { margin: 16px 0 0; color: var(--muted); font-size: 17px; min-height: 1.5em; }
.sub span { white-space: nowrap; } /* one sentence never breaks mid-line */
.bar {
  margin-top: 24px;
  height: 16px;
  border-radius: var(--pill);
  background: var(--surface);
  overflow: hidden;
}
.fill { height: 100%; width: 0; border-radius: var(--pill); background: var(--accent); }
.links { margin-top: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
a { color: var(--muted); text-underline-offset: 4px; transition: color 150ms ease; }
/* targets: 24px tall with a mouse, 44px square under a finger */
.links a { display: inline-flex; align-items: center; min-height: 24px; }
@media (pointer: coarse) {
  .links { gap: 0; }
  .links a { min-height: 44px; min-width: 44px; }
  summary { padding: 12px 0; }
}
/* a phone on its side: the notch gutter already insets the page, so the hero
   drops its own side padding and the heading keeps two lines */
@media (pointer: coarse) and (orientation: landscape) and (max-height: 500px) {
  main { padding-top: 24px; }
  .hero { padding: 0; gap: 32px; }
}
a:hover { color: var(--fg); }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; border-radius: var(--r); }
details { width: 100%; font-size: 14px; color: var(--muted); }
details[hidden] { display: none; }
summary { cursor: pointer; width: max-content; }
.cf {
  margin-top: 8px;
  padding: 12px 16px;
  border: 1px solid var(--hairline);
  border-radius: var(--r);
  background: var(--surface);
  overflow-wrap: anywhere;
}
.cf * { font: inherit; color: inherit; margin: 0; }

.mascot { display: flex; justify-content: center; }
.cat { width: min(100%, 384px); height: auto; overflow: visible; transform: rotate(8deg); }
.bob { animation: bob 2.4s ease-in-out infinite; } /* deliberate */
.wr { animation: wrench 1.2s ease-in-out infinite alternate; } /* deliberate */
.ea { animation: ea 7s ease-in-out infinite; } /* deliberate */
.eb { animation: eb 11s ease-in-out infinite; } /* deliberate */
@keyframes bob { 0%, 100% { transform: translateY(-1.5px); } 50% { transform: translateY(1.5px); } }
@keyframes wrench { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
@keyframes ea { 0%, 100% { transform: translate(-1.6px, -1.6px); } 40% { transform: translate(-0.8px, -0.8px); } 43% { transform: translate(-2.6px, -1.2px); } 46% { transform: translate(-1.6px, -1.6px); } }
@keyframes eb { 0%, 100% { transform: translate(1.6px, 1.6px); } 61% { transform: translate(1.6px, 1.6px); } 63% { transform: translate(2.4px, 0.8px); } 66% { transform: translate(1.6px, 1.6px); } }

@media (max-width: 720px) {
  main { align-items: flex-start; padding: 32px 0 calc(48px + env(safe-area-inset-bottom, 0px)); }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 0 8px; }
  .mascot { order: -1; justify-content: flex-start; }
  .cat { width: 192px; }
  .sub { font-size: 16px; }
}
</style>
</head>
<body>
<svg class="stars" aria-hidden="true" focusable="false">
  <defs>
    <path id="p" d="M-4 0H4M0-4V4" stroke="#9a9a9a" stroke-width="1"/>
    <circle id="d" r="1" fill="#9a9a9a"/>
  </defs>
  <use href="#p" x="14%" y="14%"/><use href="#d" x="27%" y="10%"/><use href="#p" x="33%" y="12%"/>
  <use href="#d" x="48%" y="13%"/><use href="#p" x="40%" y="21%"/><use href="#d" x="62%" y="8%"/>
  <use href="#d" x="80%" y="10%"/><use href="#p" x="91%" y="16%"/><use href="#d" x="86%" y="12%"/>
  <use href="#d" x="71%" y="17%"/><use href="#d" x="9%" y="19%"/><use href="#d" x="12%" y="30%"/>
  <use href="#p" x="53%" y="29%"/><use href="#p" x="76%" y="28%"/><use href="#d" x="88%" y="33%"/>
  <use href="#d" x="7%" y="43%"/><use href="#d" x="59%" y="39%"/><use href="#d" x="98%" y="51%"/>
  <use href="#p" x="60%" y="61%"/><use href="#d" x="41%" y="61%"/><use href="#p" x="34%" y="66%"/>
  <use href="#d" x="67%" y="65%"/><use href="#d" x="80%" y="68%"/><use href="#p" x="89%" y="64%"/>
  <use href="#d" x="93%" y="60%"/><use href="#d" x="12%" y="70%"/><use href="#d" x="46%" y="72%"/>
  <use href="#p" x="55%" y="78%"/><use href="#d" x="78%" y="77%"/><use href="#p" x="93%" y="77%"/>
  <use href="#p" x="36%" y="83%"/><use href="#d" x="33%" y="86%"/><use href="#d" x="72%" y="83%"/>
  <use href="#p" x="84%" y="92%"/><use href="#d" x="11%" y="95%"/><use href="#d" x="49%" y="93%"/>
  <use href="#d" x="61%" y="96%"/><use href="#d" x="25%" y="96%"/><use href="#d" x="4%" y="99%"/>
</svg>

<header class="wrap">
  <div class="nav">
    <span class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#face" fill="#ffffff"/></svg>
      superbot.gg
    </span>
    <span class="chip" id="chip"><span class="dot" aria-hidden="true"></span><span id="chip-text">updating</span></span>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <div class="copy">
      <h1>we’re updating superbot.</h1>
      <p class="sub" id="msg" role="status" aria-live="polite"><span>usually under a minute.</span> <span>no need to refresh.</span></p>
      <div class="bar" id="bar" role="progressbar" aria-label="update progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
      <div class="links">
        <a href="https://x.com/superbot_gg" rel="noopener" target="_blank">@superbot_gg</a>
        <details id="details">
          <summary>error details</summary>
          <div class="cf" id="cf-box">::CLOUDFLARE_ERROR_500S_BOX::</div>
        </details>
      </div>
    </div>
    <div class="mascot" aria-hidden="true">
      <svg class="cat" viewBox="0 0 120 100" width="384" height="320" focusable="false">
        <defs>
          <mask id="fm" maskUnits="userSpaceOnUse" x="-30" y="-30" width="180" height="160">
            <g fill="#ffffff"><rect x="14" y="32" width="72" height="54" rx="15"/><path d="M14 46V28Q14 20 21 21Q28 24 36 32Z"/><path d="M86 46V28Q86 20 79 21Q72 24 64 32Z"/></g>
            <g fill="#000000"><ellipse cx="35" cy="58" rx="8" ry="11"/><ellipse cx="65" cy="58" rx="8" ry="11"/></g>
          </mask>
          <mask id="wm" maskUnits="userSpaceOnUse" x="-20" y="-50" width="40" height="70">
            <g fill="#ffffff"><rect x="-2.6" y="-26" width="5.2" height="32" rx="2.6"/><circle cx="0" cy="-28" r="7"/></g>
            <rect x="-2.6" y="-40" width="5.2" height="12" rx="1" fill="#000000"/>
          </mask>
          <rect id="face" x="-30" y="-30" width="180" height="160" mask="url(#fm)"/>
          <rect id="wbody" x="-20" y="-50" width="40" height="70" mask="url(#wm)"/>
          <ellipse id="paw" cx="0" cy="0" rx="6.5" ry="5.2"/>
        </defs>
        <g class="bob">
          <g transform="translate(92 76) rotate(28)">
            <g class="wr">
              <use href="#wbody" class="ea" fill="#00e5c3"/>
              <use href="#wbody" class="eb" fill="#c026d3"/>
              <use href="#wbody" fill="#ffffff"/>
            </g>
          </g>
          <use href="#face" class="ea" fill="#00e5c3"/>
          <use href="#face" class="eb" fill="#c026d3"/>
          <use href="#face" fill="#ffffff"/>
          <g transform="translate(90 80) rotate(-20)">
            <use href="#paw" class="ea" fill="#00e5c3"/>
            <use href="#paw" class="eb" fill="#c026d3"/>
            <use href="#paw" fill="#ffffff"/>
          </g>
        </g>
      </svg>
    </div>
  </div>
</main>

<script>
(function () {
  // Cloudflare replaces its token inside #cf-box with the error details. The
  // comparison string is assembled here so this script never carries a second
  // copy of the token for Cloudflare to substitute.
  var TOKEN = '::CLOUDFLARE_' + 'ERROR_500S_BOX::';
  var box = document.getElementById('cf-box');
  var demo = box.textContent.trim() === TOKEN;
  var fill = document.getElementById('fill');
  var bar = document.getElementById('bar');
  var msg = document.getElementById('msg');
  var chipText = document.getElementById('chip-text');
  if (demo) document.getElementById('details').hidden = true;
  // Each sentence is its own nowrap span, so a line break only falls between sentences.
  function say(text) {
    msg.textContent = '';
    text.split(/(?<=\.) /).forEach(function (s, i) {
      if (i) msg.appendChild(document.createTextNode(' '));
      var span = document.createElement('span');
      span.textContent = s;
      msg.appendChild(span);
    });
  }

  var t0 = performance.now();
  var p = 0, slow = false, back = false, backAt = 0, backFrom = 0;
  // Time-based: eases toward 92% (about 90% by 75s), never claims done early.
  function eased(ms) { return 92 * (1 - Math.exp(-ms / 20000)); }

  function frame(now) {
    if (back) {
      var k = Math.min(1, (now - backAt) / 400);
      p = backFrom + (100 - backFrom) * (1 - Math.pow(1 - k, 3));
    } else {
      var e = now - t0;
      p = eased(e);
      if (!slow && e > 120000) {
        slow = true;
        say('taking longer than usual. still on it.');
      }
    }
    fill.style.width = p.toFixed(2) + '%';
    bar.setAttribute('aria-valuenow', String(Math.round(p)));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (demo) return; // viewed directly at /updating: animate only, never poll or reload

  function recovered() {
    if (back) return;
    back = true;
    backFrom = p;
    backAt = performance.now();
    say('we’re back. reloading.');
    chipText.textContent = 'back';
    setTimeout(function () { location.reload(); }, 600);
  }

  var delay = 3000;
  function schedule() {
    setTimeout(poll, delay);
    delay = Math.min(10000, Math.round(delay * 1.5));
  }
  function poll() {
    fetch(location.href, { method: 'HEAD', cache: 'no-store', redirect: 'manual', credentials: 'same-origin' })
      .then(function (r) {
        // An opaque redirect (status 0) means the origin answered: it is back.
        if (r.status < 500) recovered(); else schedule();
      }, schedule);
  }
  schedule();
})();
</script>
</body>
</html>
