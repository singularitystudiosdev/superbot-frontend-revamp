<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100"><!-- the base duotone cat mark, kept under its small-size name (mark-duo-sm.svg) for its consumers: the site-nav wordmark at 24px and the auth tiles. Geometrically identical to mark.svg - the storm ghosts sit at the kit's base step of 1.2 on the 100 viewBox (teal ghost up-left, magenta ghost down-right), so this is a downsized big mark, not a separate small-size variant. Owner's call, 2026-09-19: at nav size the teal/magenta fringe is accepted as near-invisible; do not widen the offset back out. --><defs><mask id="face" maskUnits="userSpaceOnUse" x="-30" y="-30" width="160" height="160"><g fill="#fff"><rect x="14" y="32" width="72" height="54" rx="15"/>
