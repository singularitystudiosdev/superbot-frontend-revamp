<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Categories Superbot wins outright</title><rect width="1200" height="760" fill="#000000"/><text x="64" y="96" font-size="34" font-weight="600" fill="#ececec" text-anchor="start" >Where Superbot wins outright</text><text x="64" y="134" font-size="19" font-weight="400" fill="#9a9a9a" text-anchor="start" >Categories where no rival matched Superbot's best tier.</text><rect x="330" y="170" width="14" height="14" rx="4" fill="#4d8aff"/><text x="352" y="182" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="start" >Superbot tier</text><rect x="500" y="170" width="14" height="14" rx="4" fill="#5c5c5c"/><text x="522" y="182" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="start" >Best rival</text><text x="314" y="240" font-size="19" font-weight="600" fill="#ececec" text-anchor="end" >Missing attachments</text><path d="M330,208H946A4,4 0 0 1 950,212V228A4,4 0 0 1 946,232H330Z" fill="#4d8aff"><title>Missing attachments: Superbot 100%</title></path><text x="960" y="226" font-size="15" font-weight="600" fill="#ececec" text-anchor="start" >Superbot 100%</text><path d="M330,238H636A4,4 0 0 1 640,242V258A4,4 0 0 1 636,262H330Z" fill="#5c5c5c"><title>Missing attachments: GPT-5.5 (API) 50%</title></path><text x="650" y="256" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="start" >GPT-5.5 (API) 50%</text><text x="314" y="346" font-size="19" font-weight="600" fill="#ececec" text-anchor="end" >Casual chat</text><path d="M330,314H946A4,4 0 0 1 950,318V334A4,4 0 0 1 946,338H330Z" fill="#4d8aff"><title>Casual chat: Superbot Fast 100%</title></path><text x="960" y="332" font-size="15" font-weight="600" fill="#ececec" text-anchor="start" >Superbot Fast 100%</text><path d="M330,344H636A4,4 0 0 1 640,348V364A4,4 0 0 1 636,368H330Z" fill="#5c5c5c"><title>Casual chat: Claude Code 50%</title></path><text x="650" y="362" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="start" >Claude Code 50%</text><text x="64" y="698" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality run, 2026-10-02 (corrected). Two prompts per category, so read these as a direction, not proof.</text><text x="64" y="720" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Six of the 40 prompts were re-measured after we fixed how tool use is recorded and the rival CLIs' network and permission settings.</text></svg>
