<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>First token 1.1x sooner than full: 7.3s tidy, first token on a cold call</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Context engine: tidy vs full</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">First token 1.1x sooner than full</text><text x="60" y="318" font-size="104" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-3.1">7.3s</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >tidy, first token on a cold call</text><text x="780" y="214" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Lower is better</text><line x1="780" y1="230" x2="780" y2="320" stroke="#262626"/><text x="766" y="257" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Tidy</text><path d="M780,236H997.5288888888889A4,4 0 0 1 1001.5288888888889,240V262A4,4 0 0 1 997.5288888888889,266H780Z" fill="#4d8aff"><title>Tidy: 7.33s</title></path><text x="1011.5288888888889" y="257" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >7.33s</text><text x="766" y="305" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Full</text><path d="M780,284H1025.4995555555556A4,4 0 0 1 1029.4995555555556,288V310A4,4 0 0 1 1025.4995555555556,314H780Z" fill="#5c5c5c"><title>Full: 8.26s</title></path><text x="1039.4995555555556" y="305" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >8.26s</text><text x="64" y="546" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Median time to the first answer token, cold call. Paired over 22 tasks: 0.8s to 2.8s sooner, 95% CI.</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Context run, 2026-10-02: Superbot's context, 24 tasks, Sonnet 5, paired by task.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Full sends every rule on every call; tidy sends only the rules each task needs.</text></svg>
