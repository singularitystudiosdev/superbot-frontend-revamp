<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Wins most head-to-head matchups: 137 of 240 prompts won against six rivals</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality: prompt by prompt</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">Wins most head-to-head matchups</text><text x="60" y="318" font-size="78" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-2.3">137 of 240</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >prompts won against six rivals</text><line x1="780" y1="200" x2="780" y2="338" stroke="#262626"/><text x="766" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Won</text><path d="M780,206H1008.9A4,4 0 0 1 1012.9,210V232A4,4 0 0 1 1008.9,236H780Z" fill="#4d8aff"><title>Won: 137</title></path><text x="1022.9" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >137</text><text x="766" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Tied</text><path d="M780,254H811.7A4,4 0 0 1 815.7,258V280A4,4 0 0 1 811.7,284H780Z" fill="#5c5c5c"><title>Tied: 21</title></path><text x="825.7" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >21</text><text x="766" y="323" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Lost</text><path d="M780,302H915.4A4,4 0 0 1 919.4,306V328A4,4 0 0 1 915.4,332H780Z" fill="#c47a45"><title>Lost: 82</title></path><text x="929.4" y="323" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >82</text><text x="64" y="546" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Each answer set against each rival's on the same prompt: fewer missed lines, then a first-try pass, then the higher score.</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality run, 2026-10-02 (corrected): 40 prompts x 6 rivals.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Rivals: Claude Code, Codex CLI, Cursor CLI, and the Opus 5.5, Sonnet 5.5 high and GPT-5.5 APIs.</text></svg>
