<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>More useful answers: 87.4 mean usefulness, out of 100</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality: 40 real-world asks</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">More useful answers</text><text x="60" y="318" font-size="104" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-3.1">87.4</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >mean usefulness, out of 100</text><line x1="780" y1="200" x2="780" y2="386" stroke="#262626"/><text x="766" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Superbot</text><path d="M780,206H1013.7280000000001A4,4 0 0 1 1017.7280000000001,210V232A4,4 0 0 1 1013.7280000000001,236H780Z" fill="#4d8aff"><title>Superbot: 87.4</title></path><text x="1027.728" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >87.4</text><text x="766" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Claude Code</text><path d="M780,254H1006.384A4,4 0 0 1 1010.384,258V280A4,4 0 0 1 1006.384,284H780Z" fill="#5c5c5c"><title>Claude Code: 84.7</title></path><text x="1020.384" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >84.7</text><text x="766" y="323" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Codex CLI</text><path d="M780,302H988.976A4,4 0 0 1 992.976,306V328A4,4 0 0 1 988.976,332H780Z" fill="#5c5c5c"><title>Codex CLI: 78.3</title></path><text x="1002.976" y="323" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >78.3</text><text x="766" y="371" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Sonnet 5.5 high (API)</text><path d="M780,350H976.4639999999999A4,4 0 0 1 980.4639999999999,354V376A4,4 0 0 1 976.4639999999999,380H780Z" fill="#5c5c5c"><title>Sonnet 5.5 high (API): 73.7</title></path><text x="990.4639999999999" y="371" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >73.7</text><text x="64" y="524" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Usefulness: the judge's 0 to 100 score per answer, averaged over 40 prompts.</text><text x="64" y="546" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality run, 2026-10-02 (corrected): 40 prompts, 1 sample, judge-graded.</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Rivals: Claude Code, Codex CLI, Cursor CLI, and the Opus 5.5, Sonnet 5.5 high and GPT-5.5 APIs; top three shown.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Six of the 40 prompts were re-measured after we fixed how tool use is recorded and the rival CLIs' network and permission settings.</text></svg>
