<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Right the first time on more asks: 57.5% one-shot pass rate</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality: 40 real-world asks</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">Right the first time on more asks</text><text x="60" y="318" font-size="104" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-3.1">57.5%</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >one-shot pass rate</text><line x1="780" y1="200" x2="780" y2="386" stroke="#262626"/><text x="766" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Superbot</text><path d="M780,206H999.4285714285714A4,4 0 0 1 1003.4285714285714,210V232A4,4 0 0 1 999.4285714285714,236H780Z" fill="#4d8aff"><title>Superbot: 57.5%</title></path><text x="1013.4285714285714" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >57.5%</text><text x="766" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Claude Code</text><path d="M780,254H980A4,4 0 0 1 984,258V280A4,4 0 0 1 980,284H780Z" fill="#5c5c5c"><title>Claude Code: 52.5%</title></path><text x="994" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >52.5%</text><text x="766" y="323" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Opus 5.5 (API)</text><path d="M780,302H950.8571428571429A4,4 0 0 1 954.8571428571429,306V328A4,4 0 0 1 950.8571428571429,332H780Z" fill="#5c5c5c"><title>Opus 5.5 (API): 45%</title></path><text x="964.8571428571429" y="323" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >45%</text><text x="766" y="371" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Codex CLI</text><path d="M780,350H950.8571428571429A4,4 0 0 1 954.8571428571429,354V376A4,4 0 0 1 950.8571428571429,380H780Z" fill="#5c5c5c"><title>Codex CLI: 45%</title></path><text x="964.8571428571429" y="371" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >45%</text><text x="64" y="524" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Pass: the judge scores fulfillment of the prompt's checklist at 95 or above.</text><text x="64" y="546" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality run, 2026-10-02 (corrected): 40 prompts, 1 sample, judge-graded.</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Rivals: Claude Code, Codex CLI, Cursor CLI, and the Opus 5.5, Sonnet 5.5 high and GPT-5.5 APIs; top three shown.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Six of the 40 prompts were re-measured after we fixed how tool use is recorded and the rival CLIs' network and permission settings.</text></svg>
