<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Misses half as many lines: 0.18 checklist lines missed per answer</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality: 40 real-world asks</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">Misses half as many lines</text><text x="60" y="318" font-size="104" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-3.1">0.18</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >checklist lines missed per answer</text><text x="780" y="214" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Lower is better</text><line x1="780" y1="230" x2="780" y2="416" stroke="#262626"/><text x="766" y="257" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Superbot</text><path d="M780,236H823.6A4,4 0 0 1 827.6,240V262A4,4 0 0 1 823.6,266H780Z" fill="#4d8aff"><title>Superbot: 0.18</title></path><text x="837.6" y="257" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >0.18</text><text x="766" y="305" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Claude Code</text><path d="M780,284H871.2A4,4 0 0 1 875.2,288V310A4,4 0 0 1 871.2,314H780Z" fill="#5c5c5c"><title>Claude Code: 0.35</title></path><text x="885.2" y="305" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >0.35</text><text x="766" y="353" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Cursor CLI</text><path d="M780,332H918.8A4,4 0 0 1 922.8,336V358A4,4 0 0 1 918.8,362H780Z" fill="#5c5c5c"><title>Cursor CLI: 0.53</title></path><text x="932.8" y="353" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >0.53</text><text x="766" y="401" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Codex CLI</text><path d="M780,380H952.8A4,4 0 0 1 956.8,384V406A4,4 0 0 1 952.8,410H780Z" fill="#5c5c5c"><title>Codex CLI: 0.65</title></path><text x="966.8" y="401" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >0.65</text><text x="64" y="524" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Each prompt carries a 2 to 5 line checklist; the judge lists every line an answer misses.</text><text x="64" y="546" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality run, 2026-10-02 (corrected): 40 prompts, 1 sample, judge-graded.</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Rivals: Claude Code, Codex CLI, Cursor CLI, and the Opus 5.5, Sonnet 5.5 high and GPT-5.5 APIs; top three shown.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Six of the 40 prompts were re-measured after we fixed how tool use is recorded and the rival CLIs' network and permission settings.</text></svg>
