<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Every everyday ask answered correctly: 14 of 14 everyday asks answered</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Desktop app: Superbot vs Claude Agent SDK</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">Every everyday ask answered correctly</text><text x="60" y="318" font-size="97" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-2.9">14 of 14</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >everyday asks answered</text><line x1="780" y1="200" x2="780" y2="290" stroke="#262626"/><text x="766" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Superbot</text><path d="M780,206H1048A4,4 0 0 1 1052,210V232A4,4 0 0 1 1048,236H780Z" fill="#4d8aff"><title>Superbot: 14 of 14</title></path><text x="1062" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >14 of 14</text><text x="766" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Claude Agent SDK</text><path d="M780,254H989.7919999999999A4,4 0 0 1 993.7919999999999,258V280A4,4 0 0 1 989.7919999999999,284H780Z" fill="#5c5c5c"><title>Claude Agent SDK: 11 of 14</title></path><text x="1003.7919999999999" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >11 of 14</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Seven chat-shaped prompts x 2; the Agent SDK gave 2 wrong answers and timed out once.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9