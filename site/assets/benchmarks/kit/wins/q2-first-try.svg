<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Done in one turn more often: 92.5% answers judged one-shot (37 of 40)</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality: 40 real-world asks</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">Done in one turn more often</text><text x="60" y="318" font-size="104" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-3.1">92.5%</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >answers judged one-shot (37 of 40)</text><line x1="780" y1="200" x2="780" y2="386" stroke="#262626"/><text x="766" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Superbot</text><path d="M780,206H1027.6A4,4 0 0 1 1031.6,210V232A4,4 0 0 1 1027.6,236H780Z" fill="#4d8aff"><title>Superbot: 92.5%</title></path><text x="1041.6" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >92.5%</text><text x="766" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Claude Code</text><path d="M780,254H1000.4A4,4 0 0 1 1004.4,258V280A4,4 0 0 1 1000.4,284H780Z" fill="#5c5c5c"><title>Claude Code: 82.5%</title></path><text x="1014.4" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >82.5%</text><text x="766" y="323" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Cursor CLI</text><path d="M780,302H973.2A4,4 0 0 1 977.2,306V328A4,4 0 0 1 973.2,332H780Z" fill="#5c5c5c"><title>Cursor CLI: 72.5%</title></path><text x="987.2" y="323" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >72.5%</text><text x="766" y="371" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Codex CLI</text><path d="M780,350H966.4A4,4 0 0 1 970.4,354V376A4,4 0 0 1 966.4,380H780Z" fill="#5c5c5c"><title>Codex CLI: 70%</title></path><text x="980.4" y="371" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >70%</text><text x="64" y="524" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >One-shot: the judge marked the answer complete with no follow-up turn needed.</text><text x="64" y="546" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality run, 2026-10-02 (corrected): 40 prompts, 1 sample, judge-graded.</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Rivals: Claude Code, Codex CLI, Cursor CLI, and the Opus 5.5, Sonnet 5.5 high and GPT-5.5 APIs; top three shown.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Six of the 40 prompts were re-measured after we fixed how tool use is recorded and the rival CLIs' network and permission settings.</text></svg>
