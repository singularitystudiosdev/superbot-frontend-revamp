<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Follows directives as well as full: 88% of standing directives followed</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Context engine: tidy vs full</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">Follows directives as well as full</text><text x="60" y="318" font-size="104" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-3.1">88%</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >of standing directives followed</text><line x1="780" y1="200" x2="780" y2="290" stroke="#262626"/><text x="766" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Tidy</text><path d="M780,206H1015.36A4,4 0 0 1 1019.36,210V232A4,4 0 0 1 1015.36,236H780Z" fill="#4d8aff"><title>Tidy: 88%</title></path><text x="1029.3600000000001" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >88%</text><text x="766" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Full</text><path d="M780,254H1008.016A4,4 0 0 1 1012.016,258V280A4,4 0 0 1 1008.016,284H780Z" fill="#5c5c5c"><title>Full: 85.3%</title></path><text x="1022.016" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >85.3%</text><text x="64" y="546" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Directives: standing rules honoured, per task. Tidy minus full: +2.7 points, 95% CI −0.8 to +6.8, so level.</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Context run, 2026-10-02: Superbot's context, 24 tasks, Sonnet 5, paired by task.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Full sends every rule on every call; tidy sends only the rules each task needs.</text></svg>
