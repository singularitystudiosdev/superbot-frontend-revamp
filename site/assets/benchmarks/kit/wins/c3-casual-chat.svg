<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Reads the room in casual chat: 100% 2 of 2 passed, Superbot Fast</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Category: casual chat</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">Reads the room in casual chat</text><text x="60" y="318" font-size="104" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-3.1">100%</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >2 of 2 passed, Superbot Fast</text><line x1="780" y1="200" x2="780" y2="386" stroke="#262626"/><text x="766" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Superbot Fast</text><path d="M780,206H1048A4,4 0 0 1 1052,210V232A4,4 0 0 1 1048,236H780Z" fill="#4d8aff"><title>Superbot Fast: 100%</title></path><text x="1062" y="227" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >100%</text><text x="766" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Claude Code</text><path d="M780,254H912A4,4 0 0 1 916,258V280A4,4 0 0 1 912,284H780Z" fill="#5c5c5c"><title>Claude Code: 50%</title></path><text x="926" y="275" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >50%</text><text x="766" y="323" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Sonnet 5.5 high (API)</text><path d="M780,302H912A4,4 0 0 1 916,306V328A4,4 0 0 1 912,332H780Z" fill="#5c5c5c"><title>Sonnet 5.5 high (API): 50%</title></path><text x="926" y="323" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >50%</text><text x="766" y="371" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Codex CLI</text><text x="790" y="371" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >0%</text><text x="64" y="546" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Two conversational prompts: small talk after a walk, and a low-mood check-in.</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality run, 2026-10-02 (corrected). Two prompts per category, so read it as a direction, not proof.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Six of the 40 prompts were re-measured after we fixed how tool use is recorded and the rival CLIs' network and permission settings.</text></svg>
