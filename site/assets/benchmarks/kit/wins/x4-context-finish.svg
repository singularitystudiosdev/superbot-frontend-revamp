<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Finishes 1.2x sooner than full: 10.6s tidy, send to last token, cold call</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Context engine: tidy vs full</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">Finishes 1.2x sooner than full</text><text x="60" y="318" font-size="104" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-3.1">10.6s</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >tidy, send to last token, cold call</text><text x="780" y="214" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Lower is better</text><line x1="780" y1="230" x2="780" y2="320" stroke="#262626"/><text x="766" y="257" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Tidy</text><path d="M780,236H982.7491428571428A4,4 0 0 1 986.7491428571428,240V262A4,4 0 0 1 982.7491428571428,266H780Z" fill="#4d8aff"><title>Tidy: 10.6s</title></path><text x="996.7491428571428" y="257" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >10.6s</text><text x="766" y="305" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Full</text><path d="M780,284H1021.9268571428572A4,4 0 0 1 1025.9268571428572,288V310A4,4 0 0 1 1021.9268571428572,314H780Z" fill="#5c5c5c"><title>Full: 12.7s</title></path><text x="1035.9268571428572" y="305" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >12.7s</text><text x="64" y="546" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Median time from send to the last token, cold call. Paired by task: 0.6s to 2.1s sooner, 95% CI.</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Context run, 2026-10-02: Superbot's context, 24 tasks, Sonnet 5, paired by task.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Full sends every rule on every call; tidy sends only the rules each task needs.</text></svg>
