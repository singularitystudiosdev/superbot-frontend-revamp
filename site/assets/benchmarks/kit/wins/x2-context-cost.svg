<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Costs 2.9x less per call than full: 2.9x cost per call, full vs tidy</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Context engine: tidy vs full</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">Costs 2.9x less per call than full</text><text x="60" y="318" font-size="104" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-3.1">2.9x</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >cost per call, full vs tidy</text><text x="780" y="214" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Lower is better</text><line x1="780" y1="230" x2="780" y2="320" stroke="#262626"/><text x="766" y="257" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Tidy</text><path d="M780,236H862.7623604465709A4,4 0 0 1 866.7623604465709,240V262A4,4 0 0 1 862.7623604465709,266H780Z" fill="#4d8aff"><title>Tidy: 1x</title></path><text x="876.7623604465709" y="257" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >1x</text><text x="766" y="305" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Full</text><path d="M780,284H1026.2226475279108A4,4 0 0 1 1030.2226475279108,288V310A4,4 0 0 1 1026.2226475279108,314H780Z" fill="#5c5c5c"><title>Full: 2.9x</title></path><text x="1040.2226475279108" y="305" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >2.9x</text><text x="64" y="546" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Cost per call relative to tidy, same model and tasks. Paired by task, tidy is cheaper and the 95% CI is clear of zero.</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Context run, 2026-10-02: Superbot's context, 24 tasks, Sonnet 5, paired by task.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Full sends every rule on every call; tidy sends only the rules each task needs.</text></svg>
