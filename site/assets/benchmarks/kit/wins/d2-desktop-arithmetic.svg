<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Answers a quick sum 38x faster: 0.75s to answer “What is 347 × 29?”</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="84" font-size="18" font-weight="400" fill="#9a9a9a" text-anchor="start" >Desktop app: Superbot vs Claude Agent SDK</text><text x="64" y="142" font-size="40" font-weight="600" fill="#ececec" text-anchor="start" letter-spacing="-0.5">Answers a quick sum 38x faster</text><text x="60" y="318" font-size="104" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-3.1">0.75s</text><rect x="64" y="350" width="56" height="6" rx="3" fill="#4d8aff"/><text x="64" y="398" font-size="20" font-weight="400" fill="#cfcfcf" text-anchor="start" >to answer “What is 347 × 29?”</text><text x="780" y="214" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Lower is better</text><line x1="780" y1="230" x2="780" y2="320" stroke="#262626"/><text x="766" y="257" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Superbot</text><path d="M780,236H782.8A4,4 0 0 1 786.8,240V262A4,4 0 0 1 782.8,266H780Z" fill="#4d8aff"><title>Superbot: 0.75s</title></path><text x="796.8" y="257" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >0.75s</text><text x="766" y="305" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Claude Agent SDK</text><path d="M780,284H1036.2133333333334A4,4 0 0 1 1040.2133333333334,288V310A4,4 0 0 1 1036.2133333333334,314H780Z" fill="#5c5c5c"><title>Claude Agent SDK: 28.7s</title></path><text x="1050.2133333333334" y="305" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >28.7s</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Median wall clock from send to settled answer; both engines answered correctly.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Desktop run, 2026-10-02: same Mac, same model, 2 runs per prompt.</text></svg>
