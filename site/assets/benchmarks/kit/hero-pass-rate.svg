<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Superbot one-shot pass rate, 57.5%, ahead of every outside rival</title><rect width="1600" height="900" fill="#000000"/><text x="96" y="150" font-size="24" font-weight="400" fill="#9a9a9a" text-anchor="start" >One-shot pass rate on 40 real-world asks</text><text x="88" y="330" font-size="176" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-6">57.5%</text><rect x="96" y="372" width="72" height="6" rx="3" fill="#4d8aff"/><text x="96" y="436" font-size="30" font-weight="400" fill="#cfcfcf" text-anchor="start" >Superbot got 23 of 40 right the first time.</text><text x="96" y="482" font-size="24" font-weight="400" fill="#9a9a9a" text-anchor="start" >Next best outside Superbot: Claude Code, 52.5%.</text><line x1="1070" y1="142" x2="1070" y2="584" stroke="#262626" stroke-width="1"/><text x="1070" y="608" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >0%</text><line x1="1178" y1="142" x2="1178" y2="584" stroke="#262626" stroke-width="1"/><text x="1178" y="608" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >20%</text><line x1="1286" y1="142" x2="1286" y2="584" stroke="#262626" stroke-width="1"/><text x="1286" y="608" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >40%</text><line x1="1394" y1="142" x2="1394" y2="584" stroke="#262626" stroke-width="1"/><text x="1394" y="608" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >60%</text><text x="1054" y="170.95" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Superbot</text><path d="M1070,150H1376.5A4,4 0 0 1 1380.5,154V176A4,4 0 0 1 1376.5,180H1070Z" fill="#4d8aff"><title>Superbot: 57.5% (23 of 40)</title></path><text x="1390.5" y="170.95" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >57.5%</text><text x="1054" y="214.95" font-size="17" font-weight="600" fill="#ececec" text-anchor="end" >Superbot Fast</text><path d="M1070,194H1376.5A4,4 0 0 1 1380.5,198V220A4,4 0 0 1 1376.5,224H1070Z" fill="#4d8aff"><title>Superbot Fast: 57.5% (23 of 40)</title></path><text x="1390.5" y="214.95" font-size="17" font-weight="600" fill="#ececec" text-anchor="start" >57.5%</text><text x="1054" y="258.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Superbot SUPER (on)</text><path d="M1070,238H1349.5A4,4 0 0 1 1353.5,242V264A4,4 0 0 1 1349.5,268H1070Z" fill="#5c5c5c"><title>Superbot SUPER (on): 52.5% (21 of 40)</title></path><text x="1363.5" y="258.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >52.5%</text><text x="1054" y="302.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Claude Code</text><path d="M1070,282H1349.5A4,4 0 0 1 1353.5,286V308A4,4 0 0 1 1349.5,312H1070Z" fill="#5c5c5c"><title>Claude Code: 52.5% (21 of 40)</title></path><text x="1363.5" y="302.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >52.5%</text><text x="1054" y="346.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Superbot SUPER (auto)</text><path d="M1070,326H1322.5A4,4 0 0 1 1326.5,330V352A4,4 0 0 1 1322.5,356H1070Z" fill="#5c5c5c"><title>Superbot SUPER (auto): 47.5% (19 of 40)</title></path><text x="1336.5" y="346.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >47.5%</text><text x="1054" y="390.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Opus 5.5 (API)</text><path d="M1070,370H1309A4,4 0 0 1 1313,374V396A4,4 0 0 1 1309,400H1070Z" fill="#5c5c5c"><title>Opus 5.5 (API): 45% (18 of 40)</title></path><text x="1323" y="390.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >45%</text><text x="1054" y="434.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Codex CLI</text><path d="M1070,414H1309A4,4 0 0 1 1313,418V440A4,4 0 0 1 1309,444H1070Z" fill="#5c5c5c"><title>Codex CLI: 45% (18 of 40)</title></path><text x="1323" y="434.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >45%</text><text x="1054" y="478.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Sonnet 5.5 high (API)</text><path d="M1070,458H1282A4,4 0 0 1 1286,462V484A4,4 0 0 1 1282,488H1070Z" fill="#5c5c5c"><title>Sonnet 5.5 high (API): 40% (16 of 40)</title></path><text x="1296" y="478.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >40%</text><text x="1054" y="522.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >GPT-5.5 (API)</text><path d="M1070,502H1268.5A4,4 0 0 1 1272.5,506V528A4,4 0 0 1 1268.5,532H1070Z" fill="#5c5c5c"><title>GPT-5.5 (API): 37.5% (15 of 40)</title></path><text x="1282.5" y="522.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >37.5%</text><text x="1054" y="566.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Cursor CLI</text><path d="M1070,546H1268.5A4,4 0 0 1 1272.5,550V572A4,4 0 0 1 1268.5,576H1070Z" fill="#5c5c5c"><title>Cursor CLI: 37.5% (15 of 40)</title></path><text x="1282.5" y="566.95" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="start" >37.5%</text><text x="64" y="816" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality run, 2026-10-02 (corrected): 40 prompts, 1 sample each. A pass means the judge scored fulfillment of the prompt's checklist at 95 or above.</text><text x="64" y="838" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >API setups run the bare model with no tools; CLI setups run the vendor's own agent. SUPER is Superbot's multi-model mode, run here with no extra workers.</text><text x="64" y="860" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Six of the 40 prompts were re-measured after we fixed how tool use is recorded and the rival CLIs' network and permission settings.</text></svg>
