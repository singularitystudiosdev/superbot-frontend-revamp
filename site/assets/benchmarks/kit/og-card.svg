<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Superbot one-shots 57.5% of real asks</title><rect width="1200" height="630" fill="#000000"/><text x="72" y="120" font-size="22" font-weight="400" fill="#9a9a9a" text-anchor="start" >Superbot benchmark, October 2026</text><text x="64" y="290" font-size="150" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-5">57.5%</text><rect x="72" y="326" width="64" height="6" rx="3" fill="#4d8aff"/><text x="72" y="386" font-size="30" font-weight="400" fill="#cfcfcf" text-anchor="start" >of real asks right the first time</text><text x="640" y="180" font-size="16" font-weight="400" fill="#9a9a9a" text-anchor="start" >Superbot and each vendor's own agent</text><line x1="780" y1="198" x2="780" y2="404" stroke="#262626" stroke-width="1"/><text x="780" y="428" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >0%</text><line x1="862.2857142857142" y1="198" x2="862.2857142857142" y2="404" stroke="#262626" stroke-width="1"/><text x="862.2857142857142" y="428" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >20%</text><line x1="944.5714285714286" y1="198" x2="944.5714285714286" y2="404" stroke="#262626" stroke-width="1"/><text x="944.5714285714286" y="428" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >40%</text><line x1="1026.857142857143" y1="198" x2="1026.857142857143" y2="404" stroke="#262626" stroke-width="1"/><text x="1026.857142857143" y="428" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >60%</text><text x="764" y="229.3" font-size="18" font-weight="600" fill="#ececec" text-anchor="end" >Superbot</text><path d="M780,206H1012.5714285714286A4,4 0 0 1 1016.5714285714286,210V236A4,4 0 0 1 1012.5714285714286,240H780Z" fill="#4d8aff"><title>Superbot: 57.5% (23 of 40)</title></path><text x="1026.5714285714284" y="229.3" font-size="18" font-weight="600" fill="#ececec" text-anchor="start" >57.5%</text><text x="764" y="281.3" font-size="18" font-weight="400" fill="#cfcfcf" text-anchor="end" >Claude Code</text><path d="M780,258H992A4,4 0 0 1 996,262V288A4,4 0 0 1 992,292H780Z" fill="#5c5c5c"><title>Claude Code: 52.5% (21 of 40)</title></path><text x="1006" y="281.3" font-size="18" font-weight="400" fill="#cfcfcf" text-anchor="start" >52.5%</text><text x="764" y="333.3" font-size="18" font-weight="400" fill="#cfcfcf" text-anchor="end" >Codex CLI</text><path d="M780,310H961.1428571428571A4,4 0 0 1 965.1428571428571,314V340A4,4 0 0 1 961.1428571428571,344H780Z" fill="#5c5c5c"><title>Codex CLI: 45% (18 of 40)</title></path><text x="975.1428571428571" y="333.3" font-size="18" font-weight="400" fill="#cfcfcf" text-anchor="start" >45%</text><text x="764" y="385.3" font-size="18" font-weight="400" fill="#cfcfcf" text-anchor="end" >Cursor CLI</text><path d="M780,362H930.2857142857142A4,4 0 0 1 934.2857142857142,366V392A4,4 0 0 1 930.2857142857142,396H780Z" fill="#5c5c5c"><title>Cursor CLI: 37.5% (15 of 40)</title></path><text x="944.2857142857142" y="385.3" font-size="18" font-weight="400" fill="#cfcfcf" text-anchor="start" >37.5%</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >40 judge-graded prompts. Quality run, 2026-10-02 (corrected).</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Six of the 40 prompts were re-measured after we fixed how tool use is recorded and the rival CLIs' network and permission settings.</text></svg>
