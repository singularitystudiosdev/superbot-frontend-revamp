<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Superbot head-to-head against each rival</title><rect width="1200" height="760" fill="#000000"/><text x="64" y="96" font-size="34" font-weight="600" fill="#ececec" text-anchor="start" >Superbot vs each rival, prompt by prompt</text><text x="64" y="134" font-size="19" font-weight="400" fill="#9a9a9a" text-anchor="start" >Same 40 prompts each. Superbot won 137 of 240, lost 82, tied 21.</text><rect x="314" y="172" width="14" height="14" rx="4" fill="#4d8aff"/><text x="336" y="184" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="start" >Superbot better</text><rect x="497" y="172" width="14" height="14" rx="4" fill="#5c5c5c"/><text x="519" y="184" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="start" >Tie</text><rect x="576.8" y="172" width="14" height="14" rx="4" fill="#c47a45"/><text x="598.8" y="184" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="start" >Rival better</text><text x="298" y="242" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Cursor CLI</text><path d="M314,214H949.0500000000001V258H314Z" fill="#4d8aff"><title>Cursor CLI: Superbot better on 31 of 40</title></path><text x="631.5250000000001" y="242" font-size="16" font-weight="600" fill="#0d0d0d" text-anchor="middle" >31</text><path d="M951.0500000000001,214H990.1500000000001V258H951.0500000000001Z" fill="#5c5c5c"><title>Cursor CLI: Tie on 2 of 40</title></path><text x="970.6" y="242" font-size="16" font-weight="600" fill="#ececec" text-anchor="middle" >2</text><path d="M992.1500000000001,214H1132A4,4 0 0 1 1136,218V254A4,4 0 0 1 1132,258H992.1500000000001Z" fill="#c47a45"><title>Cursor CLI: Rival better on 7 of 40</title></path><text x="1064.075" y="242" font-size="16" font-weight="600" fill="#0d0d0d" text-anchor="middle" >7</