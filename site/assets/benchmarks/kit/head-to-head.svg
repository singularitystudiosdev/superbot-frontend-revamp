9999999V456H745.55Z" fill="#5c5c5c"><title>Codex CLI: Tie on 6 of 40</title></path><text x="806.1999999999999" y="440" font-size="16" font-weight="600" fill="#ececec" text-anchor="middle" >6</text><path d="M868.8499999999999,412H1132A4,4 0 0 1 1136,416V452A4,4 0 0 1 1132,456H868.8499999999999Z" fill="#c47a45"><title>Codex CLI: Rival better on 13 of 40</title></path><text x="1002.425" y="440" font-size="16" font-weight="600" fill="#0d0d0d" text-anchor="middle" >13</text><text x="298" y="506" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Opus 5.5 (API)</text><path d="M314,478H743.55V522H314Z" fill="#4d8aff"><title>Opus 5.5 (API): Superbot better on 21 of 40</title></path><text x="528.775" y="506" font-size="16" font-weight="600" fill="#0d0d0d" text-anchor="middle" >21</text><path d="M745.55,478H805.1999999999999V522H745.55Z" fill="#5c5c5c"><title>Opus 5.5 (API): Tie on 3 of 40</title></path><text x="775.375" y="506" font-size="16" font-weight="600" fill="#ececec" text-anchor="middle" >3</text><path d="M807.1999999999999,478H1132A4,4 0 0 1 1136,482V518A4,4 0 0 1 1132,522H807.1999999999999Z" fill="#c47a45"><title>Opus 5.5 (API): Rival better on 16 of 40</title></path><text x="971.5999999999999" y="506" font-size="16" font-weight="600" fill="#0d0d0d" text-anchor="middle" >16</text><text x="298" y="572" font-size="17" font-weight="400" fill="#cfcfcf" text-anchor="end" >Claude Code</text><path d="M314,544H640.8V588H314Z" fill="#4d8aff"><title>Claude Code: Superbot better on 16 of 40</title></path><text x="477.4" y="572" font-size="16" font-weight="600" fill="#0d0d0d" text-anchor="middle" >16</text><path d="M642.8,544H743.55V588H642.8Z" fill="#5c5c5c"><title>Claude Code: Tie on 5 of 40</title></path><text x="693.175" y="572" font-size="16" font-weight="600" fill="#ececec" text-anchor="middle" >5</text><path d="M745.55,544H1132A4,4 0 0 1 1136,548V584A4,4 0 0 1 1132,588H745.55Z" fill="#c47a45"><title>Claude Code: Rival better on 19 of 40</title></path><text x="940.775" y="572" font-size="16" font-weight="600" fill="#0d0d0d" text-anchor="middle" >19</text><text x="64" y="698" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Quality run, 2026-10-02 (corrected), compared answer by answer: fewer missed checklist lines, a first-try pass, then the higher judge score.</text><text x="64" y="720" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Six of the 40 prompts were re-measured after we fixed how tool use is recorded and the rival CLIs' network and permission settings.</text></svg>
