<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>Tidy context results</title><rect width="1200" height="630" fill="#000000"/><text x="64" y="96" font-size="34" font-weight="600" fill="#ececec" text-anchor="start" >Tidy context vs full: leaner, cheaper, as good</text><text x="64" y="134" font-size="19" font-weight="400" fill="#9a9a9a" text-anchor="start" >Superbot's context engine against sending every rule, same model, same tasks.</text><rect x="64" y="200" width="250" height="260" rx="16" fill="#181818"/><rect x="92" y="234" width="32" height="4" rx="2" fill="#4d8aff"/><text x="92" y="322" font-size="56" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-1.5">−77%</text><text x="92" y="372" font-size="18" font-weight="400" fill="#cfcfcf" text-anchor="start" >rule tokens, first call</text><text x="92" y="404" font-size="15" font-weight="400" fill="#9a9a9a" text-anchor="start" >9,582 vs 42,352 tokens</text><rect x="338" y="200" width="250" height="260" rx="16" fill="#181818"/><rect x="366" y="234" width="32" height="4" rx="2" fill="#4d8aff"/><text x="366" y="322" font-size="56" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-1.5">2.9x</text><text x="366" y="372" font-size="18" font-weight="400" fill="#cfcfcf" text-anchor="start" >cheaper per call</text><text x="366" y="404" font-size="15" font-weight="400" fill="#9a9a9a" text-anchor="start" >same model, same tasks</text><rect x="612" y="200" width="250" height="260" rx="16" fill="#181818"/><rect x="640" y="234" width="32" height="4" rx="2" fill="#4d8aff"/><text x="640" y="322" font-size="56" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-1.5">78.2%</text><text x="640" y="372" font-size="18" font-weight="400" fill="#cfcfcf" text-anchor="start" >of requirements met</text><text x="640" y="404" font-size="15" font-weight="400" fill="#9a9a9a" text-anchor="start" >level with full's 73.7%</text><rect x="886" y="200" width="250" height="260" rx="16" fill="#181818"/><rect x="914" y="234" width="32" height="4" rx="2" fill="#4d8aff"/><text x="914" y="322" font-size="56" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="-1.5">1.2x</text><text x="914" y="372" font-size="18" font-weight="400" fill="#cfcfcf" text-anchor="start" >sooner full answer</text><text x="914" y="404" font-size="15" font-weight="400" fill="#9a9a9a" text-anchor="start" >10.6s vs 12.7s, cold call</text><text x="64" y="546" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Context run, 2026-10-02: Superbot's context, 24 tasks, Sonnet 5, paired by task.</text><text x="64" y="568" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Full sends every rule on every call; tidy sends only the rules each task needs.</text><text x="64" y="590" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Requirements and directives are level with full: the 95% CI of tidy minus full includes zero.</text></svg>
