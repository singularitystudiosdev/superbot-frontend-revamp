<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'SF Pro Rounded','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img"><title>One-shot pass rate against median response time</title><rect width="1200" height="800" fill="#000000"/><text x="64" y="96" font-size="34" font-weight="600" fill="#ececec" text-anchor="start" >More right answers, at a competitive speed</text><text x="64" y="134" font-size="19" font-weight="400" fill="#9a9a9a" text-anchor="start" >Up and to the left is better.</text><line x1="150" y1="610" x2="1110" y2="610" stroke="#262626"/><text x="136" y="615" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="end" >30%</text><line x1="150" y1="502.5" x2="1110" y2="502.5" stroke="#262626"/><text x="136" y="507.5" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="end" >40%</text><line x1="150" y1="395" x2="1110" y2="395" stroke="#262626"/><text x="136" y="400" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="end" >50%</text><line x1="150" y1="287.5" x2="1110" y2="287.5" stroke="#262626"/><text x="136" y="292.5" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="end" >60%</text><line x1="150" y1="180" x2="1110" y2="180" stroke="#262626"/><text x="136" y="185" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="end" >70%</text><text x="150" y="638" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >1s</text><text x="424.2857142857143" y="638" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >2s</text><text x="698.5714285714286" y="638" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >3s</text><text x="972.8571428571428" y="638" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle" >4s</text><text x="630" y="668" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="middle" >Median response time</text><text x="40" y="395" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="middle" transform="rotate(-90 40 395)">One-shot pass rate</text><circle cx="546.8914285714286" cy="314.375" r="9" fill="#4d8aff" stroke="#000000" stroke-width="2"><title>Superbot: 2.447s median, 57.5% pass</title></circle><text x="560.8914285714286" y="300.375" font-size="15" font-weight="600" fill="#ececec" text-anchor="start" >Superbot</text><circle cx="364.4914285714286" cy="314.375" r="9" fill="#4d8aff" stroke="#000000" stroke-width="2"><title>Superbot Fast: 1.782s median, 57.5% pass</title></circle><text x="350.4914285714286" y="298.375" font-size="15" font-weight="600" fill="#ececec" text-anchor="end" >Superbot Fast</text><circle cx="1032.514285714286" cy="368.125" r="7" fill="#5c5c5c" stroke="#000000" stroke-width="2"><title>Superbot SUPER (on): 4.2175s median, 52.5% pass</title></circle><text x="1018.514285714286" y="354.125" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="end" >Superbot SUPER (on) *</text><circle cx="932.8114285714287" cy="421.875" r="7" fill="#5c5c5c" stroke="#000000" stroke-width="2"><title>Superbot SUPER (auto): 3.854s median, 47.5% pass</title></circle><text x="918.8114285714287" y="443.875" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="end" >Superbot SUPER (auto) *</text><circle cx="397.1314285714286" cy="448.75" r="7" fill="#5c5c5c" stroke="#000000" stroke-width="2"><title>Opus 5.5 (API): 1.901s median, 45% pass</title></circle><text x="411.1314285714286" y="438.75" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="start" >Opus 5.5 (API)</text><circle cx="275.21142857142854" cy="502.5" r="7" fill="#5c5c5c" stroke="#000000" stroke-width="2"><title>Sonnet 5.5 high (API): 1.4565s median, 40% pass</title></circle><text x="261.21142857142854" y="524.5" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="end" >Sonnet 5.5 high (API)</text><circle cx="586.3885714285715" cy="529.375" r="7" fill="#5c5c5c" stroke="#000000" stroke-width="2"><title>GPT-5.5 (API): 2.591s median, 37.5% pass</title></circle><text x="600.3885714285715" y="535.375" font-size="15" font-weight="400" fill="#cfcfcf" text-anchor="start" >GPT-5.5 (API)</text><text x="64" y="716" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Speed: Latency run, 2026-10-02, 20 prompts x 3. Pass rate: Quality run, 2026-10-02 (corrected), 40 prompts. Different prompt sets.</text><text x="64" y="738" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >* SUPER is Superbot's multi-model mode. It ran here with no extra workers, so these points do not show it at full strength.</text><text x="64" y="760" font-size="14" font-weight="400" fill="#9a9a9a" text-anchor="start" >Six of the 40 prompts were re-measured after we fixed how tool use is recorded and the rival CLIs' network and permission settings.</text></svg>
