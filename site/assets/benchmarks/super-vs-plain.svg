<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="804" viewBox="0 0 900 402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img">
<!-- published at 2x: width/height doubled from the 900-wide viewBox; vector, not rasterized. -->
<title>SUPER vs plain Superbot, latency run 2026-10-02 and quality run 2026-10-02 (corrected)</title>
<desc>Superbot SUPER (on) and SUPER (auto) against plain Superbot: median wall time and judged pass rate. SUPER is the multi-model mode, run here with no extra workers, so its bars are not a single-model number.</desc>
<rect x="0" y="0" width="900" height="402" fill="#ffffff"/>
<text x="24" y="28" font-size="16" font-weight="600" fill="#0f172a" letter-spacing="-0.2">SUPER (on / auto) vs plain Superbot</text><text x="24" y="46" font-size="12" fill="#64748b">wall time from the latency run, pass rate from the quality run; SUPER ran with no extra workers</text><text x="860" y="390" font-size="10" fill="#64748b" text-anchor="end">Latency run, 2026-10-02 · Quality run, 2026-10-02 (corrected)</text><text x="24" y="390" font-size="10" fill="#64748b">Six prompts re-measured after the test setup was fixed.</text><text x="24" y="78" font-size="13" font-weight="600" fill="#0f172a">Median wall time (seconds)</text><text x="24" y="94" font-size="11" fill="#64748b">latency run; SUPER is the multi-model mode, run here with no extra workers</text><line x1="250" y1="104" x2="250" y2="194" stroke="#e2e8f0" stroke-width="1"/><text x="250" y="208" font-size="10" fill="#64748b" text-anchor="middle">0.00s</text><line x1="555" y1="104" x2="555" y2="194" stroke="#e2e8f0" stroke-width="1"/><text x="555" y="208" font-size="10" fill="#64748b" text-anchor="middle">2.43s</text><line x1="860" y1="104" x2="860" y2="194" stroke="#e2e8f0" stroke-width="1"/><text x="860" y="208" font-size="10" fill="#64748b" text-anchor="middle">4.85s</text><text x="240" y="123" font-size="12" fill="#0f172a" text-anchor="end" font-weight="600">Superbot</text><polygon points="250,111 549.76,111 557.76,119 549.76,127 250,127" fill="#1d4ed8" stroke="#0f172a" stroke-width="2"/><text x="565.76" y="123" font-size="11.5" fill="#0f172a">2.45s</text><text x="240" y="153" font-size="12" fill="#0f172a" text-anchor="end">Superbot SUPER (on)</text><polygon points="250,141 772.43,141 780.43,149 772.43,157 250,157" fill="#334155" stroke="none"/><text x="788.43" y="153" font-size="11.5" fill="#0f172a">4.22s</text><text x="240" y="183" font-size="12" fill="#0f172a" text-anchor="end">Superbot SUPER (auto)</text><polygon points="250,171 726.72,171 734.72,179 726.72,187 250,187" fill="#334155" stroke="none"/><text x="742.72" y="183" font-size="11.5" fill="#0f172a">3.85s</text><text x="24" y="228" font-size="13" font-weight="600" fill="#0f172a">Judged pass rate (per-prompt checklist)</text><text x="24" y="244" font-size="11" fill="#64748b">quality run; SUPER is the multi-model mode, run here with no extra workers</text><line x1="250" y1="254" x2="250" y2="344" stroke="#e2e8f0" stroke-width="1"/><text x="250" y="358" font-size="10" fill="#64748b" text-anchor="middle">0.0%</text><line x1="555" y1="254" x2="555" y2="344" stroke="#e2e8f0" stroke-width="1"/><text x="555" y="358" font-size="10" fill="#64748b" text-anchor="middle">33.1%</text><line x1="860" y1="254" x2="860" y2="344" stroke="#e2e8f0" stroke-width="1"/><text x="860" y="358" font-size="10" fill="#64748b" text-anchor="middle">66.1%</text><text x="240" y="273" font-size="12" fill="#0f172a" text-anchor="end" font-weight="600">Superbot</text><polygon points="250,261 772.43,261 780.43,269 772.43,277 250,277" fill="#1d4ed8" stroke="#0f172a" stroke-width="2"/><text x="788.43" y="273" font-size="11.5" fill="#0f172a">57.5%</text><text x="240" y="303" font-size="12" fill="#0f172a" text-anchor="end">Superbot SUPER (on)</text><polygon points="250,291 726.31,291 734.31,299 726.31,307 250,307" fill="#334155" stroke="none"/><text x="742.31" y="303" font-size="11.5" fill="#0f172a">52.5%</text><text x="240" y="333" font-size="12" fill="#0f172a" text-anchor="end">Superbot SUPER (auto)</text><polygon points="250,321 680.19,321 688.19,329 680.19,337 250,337" fill="#334155" stroke="none"/><text x="696.19" y="333" font-size="11.5" fill="#0f172a">47.5%</text>
</svg>