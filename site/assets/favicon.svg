<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
<!-- duostorm mark, bare (mark-clean.svg geometry), transparent background.
     Browser tab favicon: the face is white on a dark tab (the kit's mono
     system), black on a light tab. The eyes are mask cutouts, so the tab
     colour shows through them either way. -->
<style>
  .face { fill: #ffffff; }
  @media (prefers-color-scheme: light) { .face { fill: #000000; } }
</style>
<defs><mask id="face" maskUnits="userSpaceOnUse" x="-30" y="-30" width="160" height="160"><g fill="#fff"><rect x="14" y="32" width="72" height="54" rx="15"/>
<path d="M14 46V28Q14 20 21 21Q28 24 36 32Z"/>
<path d="M86 46V28Q86 20 79 21Q72 24 64 32Z"/></g><g fill="#000"><ellipse cx="35" cy="58" rx="8" ry="11"/><ellipse cx="65" cy="58" rx="8" ry="11"/></g></mask></defs>
<!-- the face scaled 1.14 about the face-box centre (50,53): bigger in the tab,
     still clear of the 0..100 viewBox on every side (ink spans x 9.0..91.0, y 16.4..90.6) -->
<g transform="translate(50 53) scale(1.14) translate(-50 -53)"><rect class="face" x="-30" y="-30" width="160" height="160" mask="url(#face)" opacity="1"/></g>
</svg>
